# All experiment settings live here. Change values here, not in code.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  store_id: CA_1
  items_per_category: 100     # FOODS, HOBBIES, HOUSEHOLD -> ~300 series
  min_nonzero_days: 30        # drop items that almost never sell

backtest:
  horizon: 28                 # days per forecast
  n_folds: 3                  # rolling-origin folds
  step: 28                    # days between successive cutoffs
  # Last fold's cutoff = final date - horizon; earlier folds step back by `step`.

segments:
  intermittent_zero_share: 0.5    # >50% zero days in training => intermittent
  price_volatile_cv: 0.05         # coef. of variation of price > 5% => volatile

seed: 42

# Phase 2
lightgbm:
  num_boost_round: 500
  params:
    objective: tweedie
    tweedie_variance_power: 1.1
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1

chronos:
  model_id: amazon/chronos-bolt-small   # zero-shot, not trained on our data

patchtst:
  input_size: 112        # days of history per window (4 x 28)
  max_steps: 2000        # upper bound; early stopping usually ends sooner
  patience: 3            # validation checks (every 100 steps) without improvement
  learning_rate: 0.0001
  batch_size: 32
